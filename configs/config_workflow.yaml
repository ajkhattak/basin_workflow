formulation :
  ngen_dir           : "/home/ec2-user/Projects/NextGen/ngen/"

  models                     : "NOM_CFE" # "PET_CFE"  # "NOM_CFE"
  precip_partitioning_scheme : 'Schaake'
  surface_runoff_scheme      : 'NASH_CASCADE' # 'GIUH' for cfe1.0
